<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>多媒体远程遥控器</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary-color: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent-color: #8b5cf6;
      --sleep-color: #7c3aed;
      --sleep-glow: rgba(124, 58, 237, 0.35);
      --danger-color: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.35);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 顶部标题与状态卡片 */
    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .title-area h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-area p {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #34d399;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* 主播放器卡片 */
    .player-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 26px 20px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    /* 播放控制按钮行 */
    .playback-row {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      gap: 12px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.92);
    }

    /* 上一曲/下一曲按键 */
    .btn-step {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    .btn-step:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-step svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    /* 播放/暂停核心主按钮 (默认暂停样式：冷静深蓝靛青) */
    .btn-play-pause {
      width: 86px;
      height: 86px;
      border-radius: 30px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-play-pause svg {
      width: 38px;
      height: 38px;
      fill: currentColor;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    /* 播放中状态高亮与脉冲动效：极光紫粉渐变 + 强烈光晕 */
    .btn-play-pause.playing {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: playPulse 2s infinite ease-in-out;
    }

    @keyframes playPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.6); transform: scale(1); }
      50% { box-shadow: 0 0 40px rgba(236, 72, 153, 0.9); transform: scale(1.04); }
    }

    /* 状态律动波纹条 */
    .status-bar-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-top: 4px;
    }

    .wave-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
    }

    .wave-bar {
      width: 3px;
      height: 4px;
      background: #818cf8;
      border-radius: 2px;
      transition: height 0.2s ease, background 0.3s ease;
    }

    .playing .wave-bar {
      background: #ec4899;
    }

    .playing .wave-bar:nth-child(1) {
      animation: wave 1s infinite ease-in-out 0.1s;
    }
    .playing .wave-bar:nth-child(2) {
      animation: wave 1s infinite ease-in-out 0.3s;
    }
    .playing .wave-bar:nth-child(3) {
      animation: wave 1s infinite ease-in-out 0.2s;
    }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    .status-text {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .status-bar-container.playing .status-text {
      color: #f472b6;
      font-weight: 600;
    }

    /* 音量与功能按键格 */
    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn-action {
      height: 58px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-action svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      opacity: 0.9;
    }

    /* 电源管理区卡片 */
    .power-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* 一键睡眠专用样式 */
    .btn-sleep {
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.25) 0%, rgba(99, 102, 241, 0.2) 100%);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
      font-size: 14px;
      font-weight: 600;
      gap: 8px;
      box-shadow: 0 4px 15px var(--sleep-glow);
    }

    .btn-sleep:active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.4) 0%, rgba(99, 102, 241, 0.35) 100%);
    }

    /* 安全关机专用样式 */
    .btn-shutdown {
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.15) 100%);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 14px;
      font-weight: 600;
      gap: 8px;
      box-shadow: 0 4px 15px var(--danger-glow);
    }

    .btn-shutdown:active {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.35) 0%, rgba(220, 38, 38, 0.3) 100%);
    }

    /* 浮动提示 Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 模态确认窗口 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      animation: modalIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes modalIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-box h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .modal-box p {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .btn-confirm-danger {
      background: #ef4444;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- 顶部卡片 -->
    <div class="header-card">
      <div class="title-area">
        <h1>多媒体遥控器</h1>
        <p>PC 局域网无线控制器</p>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>已连接</span>
      </div>
    </div>

    <!-- 主控面板 -->
    <div class="player-card">
      <!-- 核心切歌与播放控制 -->
      <div class="playback-row">
        <!-- 上一首 -->
        <button class="btn btn-step" onclick="handleStepSong('prev_song', '⏮ 上一首')">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <!-- 播放 / 暂停 (核心大按钮：点击动态切换播放/暂停图标与律动) -->
        <button id="btnPlayPause" class="btn btn-play-pause" onclick="togglePlayPause()" title="点击切换播放/暂停">
          <!-- 播放图标 (三角形：未播放时显示) -->
          <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <!-- 暂停图标 (双竖条：播放中时显示) -->
          <svg id="iconPause" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <!-- 下一首 -->
        <button class="btn btn-step" onclick="handleStepSong('next_song', '⏭ 下一首')">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <!-- 实时状态与律动指示条 -->
      <div id="statusIndicatorArea" class="status-bar-container">
        <div class="wave-bars">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <span id="playStatusText" class="status-text">已暂停，点击中央按钮播放</span>
      </div>

      <!-- 音量控制 -->
      <div class="control-grid">
        <button class="btn btn-action" onclick="sendAction('volume_down', '🔉 音量 -')">
          <svg viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
          <span>音量 -</span>
        </button>

        <button class="btn btn-action" onclick="sendAction('volume_up', '🔊 音量 +')">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <span>音量 +</span>
        </button>
      </div>
    </div>

    <!-- 底部电源管理区 (防误触设计) -->
    <div class="power-card">
      <!-- 一键睡眠 -->
      <button class="btn btn-sleep btn-action" onclick="sendAction('sleep', '🌙 电脑正在进入睡眠...')">
        <svg viewBox="0 0 24 24" style="fill:currentColor; width:20px; height:20px;"><path d="M12.3 2a10 10 0 0 0-1.9 20 10 10 0 0 0 8.6-4.9 1 1 0 0 0-1-1.4 8 8 0 1 1-7.1-12.3 1 1 0 0 0 1.4-1.4z"/></svg>
        <span>一键睡眠</span>
      </button>

      <!-- 安全关机 (带确认弹窗) -->
      <button class="btn btn-shutdown btn-action" onclick="openShutdownModal()">
        <svg viewBox="0 0 24 24" style="fill:currentColor; width:20px; height:20px;"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0 1 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.38 1.19-4.47 3-5.74L6.58 4.84A8.94 8.94 0 0 0 3 12a9 9 0 0 0 18 0c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
        <span>安全关机</span>
      </button>
    </div>

  </div>

  <!-- 浮动通知 Toast -->
  <div id="toast" class="toast">
    <span id="toast-text">已发送指令</span>
  </div>

  <!-- 关机确认弹窗 -->
  <div id="shutdownModal" class="modal-overlay">
    <div class="modal-box">
      <h3>确认关闭电脑？</h3>
      <p>执行后电脑将在 5 秒内自动保存并安全切断电源。</p>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeShutdownModal()">取消</button>
        <button class="modal-btn btn-confirm-danger" onclick="confirmShutdown()">确定关机</button>
      </div>
    </div>
  </div>

  <script>
    let toastTimer = null;
    let isPlaying = false; // 客户端维护的播放状态

    // 切换播放/暂停状态及图标
    function togglePlayPause() {
      isPlaying = !isPlaying;
      updatePlayPauseUI();
      sendAction('pause_play', isPlaying ? '▶ 正在播放' : '⏸ 已暂停播放');
    }

    // 更新播放按钮图标与状态动画
    function updatePlayPauseUI() {
      const btn = document.getElementById('btnPlayPause');
      const iconPlay = document.getElementById('iconPlay');
      const iconPause = document.getElementById('iconPause');
      const indicatorArea = document.getElementById('statusIndicatorArea');
      const statusText = document.getElementById('playStatusText');

      if (isPlaying) {
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
        btn.classList.add('playing');
        indicatorArea.classList.add('playing');
        statusText.innerText = '🎵 正在播放中... 点击可暂停';
      } else {
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        btn.classList.remove('playing');
        indicatorArea.classList.remove('playing');
        statusText.innerText = '⏸ 已暂停，点击中央播放';
      }
    }

    // 点击上一首/下一首切歌时，自动同步为播放中状态
    function handleStepSong(action, label) {
      isPlaying = true;
      updatePlayPauseUI();
      sendAction(action, label);
    }

    // 异步无刷新发送指令
    function sendAction(actionName, label) {
      showToast(label || '指令已发送');
      
      // 轻量震动触感反馈
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(30);
      }

      fetch('?action=' + encodeURIComponent(actionName), {
        method: 'GET',
        cache: 'no-cache'
      }).catch(err => {
        showToast('连接失败，请检查电脑是否在线');
      });
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.innerText = text;
      toast.classList.add('show');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }

    // 关机防误触模态框
    function openShutdownModal() {
      document.getElementById('shutdownModal').style.display = 'flex';
    }

    function closeShutdownModal() {
      document.getElementById('shutdownModal').style.display = 'none';
    }

    function confirmShutdown() {
      closeShutdownModal();
      sendAction('shutdown', '⛔ 电脑将在 5 秒后关机...');
    }
  </script>
</body>
</html>
